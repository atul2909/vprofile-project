name: Build Vprofile
on:
  push:
    branches: [ main, develop, docker ]
  pull_request:
    branches: 
      - main
      - develop
      - docker

  jobs:
    Build:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v4
        - name: Set up maven install
          run: mvn install
    Testing:
      runs-on: ubuntu-latest
      needs: Build
      steps:
        - name: Checkout code
          uses: actions/checkout@v4
        - name: Set up maven test
          run: mvn test
        - name: Run tests
          run: mvn test
        - name: Maven Checksytle
          run: mvn checkstyle:checkstyle
