name: Build Vprofile

on:
  push:
    branches: [main, develop, docker]
  pull_request:
    branches: [main, develop, docker]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with Maven
        run: mvn install

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tests
        run: mvn test

      - name: Checkstyle
        run: mvn checkstyle:checkstyle
